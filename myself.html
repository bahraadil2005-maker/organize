<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Dashboard & Study Hub</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #4ade80;
      --accent-red: #f87171;
      --border-color: #334155;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      margin: 0;
      font-size: 2rem;
      color: var(--text-main);
    }

    header p {
      color: var(--text-sub);
      margin-top: 6px;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    h2 {
      margin-top: 0;
      color: var(--accent-blue);
      font-size: 1.2rem;
      letter-spacing: 0.5px;
    }

    /* Countdown Styling */
    .countdown-display {
      display: flex;
      justify-content: space-around;
      margin: 24px 0;
    }

    .time-unit {
      display: flex;
      flex-direction: column;
    }

    .time-number {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .time-label {
      font-size: 0.75rem;
      color: var(--text-sub);
      text-transform: uppercase;
      margin-top: 4px;
    }

    .target-date-picker {
      margin-top: 10px;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 8px;
    }

    /* Pomodoro Styling */
    .timer-display {
      font-size: 3.5rem;
      font-weight: 800;
      margin: 15px 0;
      font-variant-numeric: tabular-nums;
    }

    .button-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 15px;
    }

    button {
      background-color: var(--border-color);
      color: var(--text-main);
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    button:hover {
      opacity: 0.9;
    }

    button:active {
      transform: scale(0.98);
    }

    button.btn-primary { background-color: var(--accent-blue); color: #000; }
    button.btn-success { background-color: var(--accent-green); color: #000; }
    button.btn-reset { background-color: var(--accent-red); color: #000; }

    .mode-buttons button {
      padding: 6px 12px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Personal Study Dashboard</h1>
    <p>Track your goals and manage focus sessions</p>
  </header>

  <div class="container">
    
    <!-- 1. Live Exam Countdown Card -->
    <div class="card">
      <h2>Exam Countdown</h2>
      <div class="countdown-display">
        <div class="time-unit"><span id="days" class="time-number">00</span><span class="time-label">Days</span></div>
        <div class="time-unit"><span id="hours" class="time-number">00</span><span class="time-label">Hours</span></div>
        <div class="time-unit"><span id="mins" class="time-number">00</span><span class="time-label">Mins</span></div>
        <div class="time-unit"><span id="secs" class="time-number">00</span><span class="time-label">Secs</span></div>
      </div>
      <input type="datetime-local" id="targetDateInput" class="target-date-picker">
    </div>

    <!-- 2. Pomodoro Focus Clock Card -->
    <div class="card">
      <h2 id="pomoStatus">Focus Session</h2>
      <div class="mode-buttons button-group">
        <button onclick="setPomodoroMode(25, 'Focus Session')">25m Focus</button>
        <button onclick="setPomodoroMode(5, 'Short Break')">5m Break</button>
        <button onclick="setPomodoroMode(15, 'Long Break')">15m Break</button>
      </div>
      <div class="timer-display" id="pomoDisplay">25:00</div>
      <div class="button-group">
        <button id="startBtn" class="btn-primary" onclick="togglePomodoro()">Start</button>
        <button class="btn-reset" onclick="resetPomodoro()">Reset</button>
      </div>
    </div>

  </div>

  <script>
    /* --- Countdown Timer Script --- */
    const targetInput = document.getElementById('targetDateInput');
    
    // Set default target to June 4, 2026 if no date is saved in localStorage
    let savedDate = localStorage.getItem('dashboardTargetDate');
    if (!savedDate) {
      savedDate = "2026-06-04T09:00";
    }
    targetInput.value = savedDate;

    targetInput.addEventListener('change', (e) => {
      localStorage.setItem('dashboardTargetDate', e.target.value);
    });

    function updateCountdown() {
      const targetTime = new Date(targetInput.value).getTime();
      const currentTime = new Date().getTime();
      const difference = targetTime - currentTime;

      if (difference > 0) {
        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
        const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((difference % (1000 * 60)) / 1000);

        document.getElementById('days').innerText = String(days).padStart(2, '0');
        document.getElementById('hours').innerText = String(hours).padStart(2, '0');
        document.getElementById('mins').innerText = String(minutes).padStart(2, '0');
        document.getElementById('secs').innerText = String(seconds).padStart(2, '0');
      } else {
        document.getElementById('days').innerText = '00';
        document.getElementById('hours').innerText = '00';
        document.getElementById('mins').innerText = '00';
        document.getElementById('secs').innerText = '00';
      }
    }
    setInterval(updateCountdown, 1000);
    updateCountdown();

    /* --- Pomodoro Clock Script --- */
    let pomoTime = 25 * 60;
    let currentTotalTime = 25 * 60;
    let pomoTimer = null;
    let isRunning = false;

    const pomoDisplay = document.getElementById('pomoDisplay');
    const startBtn = document.getElementById('startBtn');
    const pomoStatus = document.getElementById('pomoStatus');

    function updatePomoDisplay() {
      const mins = Math.floor(pomoTime / 60);
      const secs = pomoTime % 60;
      const formatted = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      pomoDisplay.innerText = formatted;
      document.title = isRunning ? `(${formatted}) Study Dashboard` : 'Personal Study Dashboard';
    }

    function togglePomodoro() {
      if (isRunning) {
        clearInterval(pomoTimer);
        startBtn.innerText = 'Start';
        startBtn.className = 'btn-primary';
        isRunning = false;
      } else {
        isRunning = true;
        startBtn.innerText = 'Pause';
        startBtn.className = 'btn-success';
        pomoTimer = setInterval(() => {
          if (pomoTime > 0) {
            pomoTime--;
            updatePomoDisplay();
          } else {
            clearInterval(pomoTimer);
            alert('Session complete! Take a break.');
            resetPomodoro();
          }
        }, 1000);
      }
    }

    function resetPomodoro() {
      clearInterval(pomoTimer);
      isRunning = false;
      pomoTime = currentTotalTime;
      startBtn.innerText = 'Start';
      startBtn.className = 'btn-primary';
      updatePomoDisplay();
    }

    function setPomodoroMode(minutes, label) {
      currentTotalTime = minutes * 60;
      pomoStatus.innerText = label;
      resetPomodoro();
    }

    updatePomoDisplay();
  </script>

</body>
</html>
