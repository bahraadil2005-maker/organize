<div id="fact-card" style="border: 1px solid #ccc; padding: 20px; border-radius: 8px; max-width: 400px; text-align: center;">
  <h3>Science & Math Fact</h3>
  <p id="fact-text">Click the button below to display a fact!</p>
  <button onclick="generateFact()" style="padding: 10px 15px; cursor: pointer;">Get New Fact</button>
</div>

<script>
  const facts = [
    "A day on Venus is longer than a year on Venus.",
    "Zero is the only number that cannot be represented in Roman numerals.",
    "Honey never spoils; archaeologists have found edible 3,000-year-old honey in Egyptian tombs.",
    "If you fold a paper 42 times, it would reach the moon.",
    "Water can boil and freeze at the same time at its 'triple point'.",
    "An octillion has 27 zeros after the 1."
  ];

  function generateFact() {
    const randomIndex = Math.floor(Math.random() * facts.length);
    document.getElementById("fact-text").innerText = facts[randomIndex];
  }
</script>
