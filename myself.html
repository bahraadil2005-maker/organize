<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Weather Widget</title>
  <style>
    /* Reset & Center Container */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f4f7f6;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Weather Card Styling */
    .weather-card {
      width: 280px;
      background: linear-gradient(135deg, #4a90e2, #50e3c2);
      color: #ffffff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      transition: transform 0.2s ease;
    }

    .weather-card:hover {
      transform: translateY(-4px);
    }

    .weather-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      opacity: 0.95;
    }

    .location-name {
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .weather-status {
      font-weight: 500;
      background: rgba(255, 255, 255, 0.2);
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
    }

    .weather-body {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 18px 0;
    }

    .temp-container {
      display: flex;
      align-items: flex-start;
    }

    .temperature {
      font-size: 3.2rem;
      font-weight: 700;
      line-height: 1;
    }

    .unit {
      font-size: 1.2rem;
      font-weight: 600;
      margin-top: 4px;
      margin-left: 2px;
    }

    .weather-icon {
      font-size: 3.2rem;
    }

    .weather-details {
      display: flex;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.3);
      padding-top: 12px;
      font-size: 0.85rem;
    }

    .detail-item {
      display: flex;
      flex-direction: column;
    }

    .detail-label {
      opacity: 0.85;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .detail-value {
      font-weight: 600;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- Weather Widget Component -->
  <div class="weather-card">
    <div class="weather-header">
      <span class="location-name" id="city-name">Erbil</span>
      <span class="weather-status" id="weather-condition">Loading...</span>
    </div>
    <div class="weather-body">
      <div class="temp-container">
        <span class="temperature" id="temperature">--</span>
        <span class="unit">°C</span>
      </div>
      <div class="weather-icon" id="weather-icon">⏳</div>
    </div>
    <div class="weather-details">
      <div class="detail-item">
        <span class="detail-label">Humidity</span>
        <span class="detail-value" id="humidity">--%</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">Wind</span>
        <span class="detail-value" id="wind-speed">-- km/h</span>
      </div>
    </div>
  </div>

  <!-- JavaScript logic to fetch live data -->
  <script>
    async function fetchLiveWeather() {
      // Erbil coordinates
      const lat = 36.19;
      const lon = 44.01;
      const apiUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m`;

      try {
        const response = await fetch(apiUrl);
        const data = await response.json();
        const current = data.current;

        // Update elements with live values
        document.getElementById('temperature').textContent = Math.round(current.temperature_2m);
        document.getElementById('humidity').textContent = `${current.relative_humidity_2m}%`;
        document.getElementById('wind-speed').textContent = `${Math.round(current.wind_speed_10m)} km/h`;

        // Weather conditions mapping
        const weatherInfo = getWeatherInfo(current.weather_code);
        document.getElementById('weather-condition').textContent = weatherInfo.text;
        document.getElementById('weather-icon').textContent = weatherInfo.icon;

      } catch (error) {
        console.error('Failed to pull live weather data:', error);
        document.getElementById('weather-condition').textContent = 'Error';
        document.getElementById('weather-icon').textContent = '⚠️';
      }
    }

    function getWeatherInfo(code) {
      if (code === 0) return { text: 'Clear Sky', icon: '☀️' };
      if (code >= 1 && code <= 3) return { text: 'Partly Cloudy', icon: '⛅' };
      if (code >= 45 && code <= 48) return { text: 'Foggy', icon: '🌫️' };
      if (code >= 51 && code <= 67) return { text: 'Rainy', icon: '🌧️' };
      if (code >= 71 && code <= 77) return { text: 'Snowy', icon: '❄️' };
      if (code >= 80 && code <= 82) return { text: 'Showers', icon: '🌦️' };
      if (code >= 95) return { text: 'Thunderstorm', icon: '⛈️' };
      return { text: 'Fair', icon: '🌤️' };
    }

    // Load weather as soon as page opens
    fetchLiveWeather();
  </script>

</body>
</html>
